name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows artifact
    runs-on: windows-latest
    outputs:
      project_version: ${{ steps.project_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read project version
        id: project_version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --name Goobs-WiFi-Scanner main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goobs-WiFi-Scanner-${{ steps.project_version.outputs.version }}
          path: dist/Goobs-WiFi-Scanner.exe

  release:
    name: Create GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Goobs-WiFi-Scanner-${{ needs.build.outputs.project_version }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.project_version }}
          name: Goobs WiFi Scanner v${{ needs.build.outputs.project_version }}
          files: dist/Goobs-WiFi-Scanner.exe
          generate_release_notes: true
